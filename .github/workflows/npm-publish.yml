name: npm-publish

# main에 push하면 자동 실행.
# 같은 버전은 npm이 거부하므로, package.json 버전이 이미 npm에 존재하면 게시를 건너뛴다.
# 새 버전을 올리고 push하면 자동으로 npm에 게시된다.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # GitHub Release/태그 생성용

jobs:
  verify:
    # Cross-platform regression gate: the package runs on macOS/Linux/Windows.
    # verify runs on all three; publish stays on Linux (one npm publish).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # npm install (not npm ci): cross-platform lockfiles can miss
      # platform-specific optional deps and npm ci would hard-fail.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify (test + check + build)
        run: npm run verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify (test + check + build)
        run: npm run verify

      - name: Publish only if version is new
        id: publish
        run: |
          set -e
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view skill-manage version 2>/dev/null || echo "none")
          echo "Local version:     $LOCAL"
          echo "Published version: $REMOTE"
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "::notice::skill-manage@$LOCAL already on npm — skipping publish."
            exit 0
          fi
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Published skill-manage@$LOCAL to npm."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.publish.outputs.published == 'true'
        run: |
          VERSION="${{ steps.publish.outputs.version }}"
          gh release create "v$VERSION" \
            --target "${{ github.sha }}" \
            --title "v$VERSION" \
            --generate-notes
          echo "::notice::Created GitHub Release v$VERSION."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
