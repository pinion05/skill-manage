name: npm-publish-dev

# dev 브랜치에 push하면 자동으로 npm에 prerelease 버전을 게시한다.
# 버전 형식: <base>-dev.<run_number>  (예: 0.1.3-dev.42)
# npm dist-tag 'dev' 로 게시 → `npm install skill-manage@dev` 설치 가능.
# package.json 의 version 필드는 CI에서만 동적으로 bump (커밋하지 않음 → 머지 충돌 방지).
on:
  push:
    branches: [dev]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish-dev:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify (test + check + build)
        run: npm run verify

      - name: Compute prerelease version
        id: ver
        run: |
          BASE=$(node -p "require('./package.json').version")
          # Strip any existing prerelease suffix to get the stable base.
          BASE_CLEAN=$(echo "$BASE" | sed 's/-.*//')
          VERSION="${BASE_CLEAN}-dev.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "::notice::Prerelease version: $VERSION"

      - name: Publish prerelease with dev tag
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public --tag dev
          echo "::notice::Published skill-manage@$VERSION to npm with tag 'dev'."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}

      - name: Create GitHub Prerelease
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "v$VERSION" \
            --target "${{ github.sha }}" \
            --title "v$VERSION (dev)" \
            --generate-notes \
            --prerelease
          echo "::notice::Created GitHub Prerelease v$VERSION."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
